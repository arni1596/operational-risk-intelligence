name: Python CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Run sample operational risk pipeline
        run: python analysis/evaluate_operational_risk.py

      - name: Run threshold sensitivity analysis
        run: python analysis/analyze_threshold_sensitivity.py

      - name: Build operational review dashboard
        run: python analysis/build_operational_review_dashboard.py

      - name: Check generated reports are committed
        shell: bash
        run: |
          set -euo pipefail

          GENERATED_REPORTS=(
            reporting/risk_review_summary.md
            reporting/threshold_sensitivity_summary.md
            reporting/operational_review_dashboard.md
          )

          if [ -n "$(git status --porcelain -- "${GENERATED_REPORTS[@]}")" ]; then
            echo "::error::Generated reporting artifacts are stale."
            echo "Regenerate the reports and commit the resulting changes."
            git status --short -- "${GENERATED_REPORTS[@]}"
            git --no-pager diff -- "${GENERATED_REPORTS[@]}"
            exit 1
          fi

          echo "Generated reporting artifacts match committed output."
